<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIM Journey - Gallery</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav>
      <div class="nav-left">
        <img src="logo.png" alt="AIM Journey Logo" class="logo" />
        <span class="nav-brand">AIM Journey</span>
      </div>
      <div class="hamburger"><span></span><span></span><span></span></div>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="quotes.html">Quotes</a>
        <a href="https://www.instagram.com/aimjourney.eu/" target="_blank"
          ><i class="fab fa-instagram instagram-icon"></i
        ></a>
      </div>
    </nav>

    <div class="container">
      <h2 class="animate-on-scroll">Story Gallery</h2>
      <div id="gallery-container" class="gallery-grid">
        <!-- Cards injected via JS -->
      </div>
    </div>

    <footer><p>&copy; 2026 AIM Journey Erasmus+ Project</p></footer>

    <script src="script.js"></script>
    <script>
      const imageNumbers = [
        1, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 15, 16, 18, 19, 20, 21, 23, 24, 25,
        26, 27, 28, 29, 30, 31,
      ];
      const container = document.getElementById("gallery-container");

      imageNumbers.forEach((num, index) => {
        const avatarPath = `content/avatars/${num}.jpeg`;
        const storyPath = `content/stories/${num}.jpeg`;
        const txtPath = `content/prompts/${num}.txt`;
        const title = `AIM_Journey_${num}`;

        const card = document.createElement("div");
        card.className = "slider-card animate-on-scroll";
        card.style.transitionDelay = `${index * 0.05}s`; // Staggered animation

        card.innerHTML = `
                <div class="slider-wrapper">
                    <div class="slider-track">
                        <img src="${avatarPath}" alt="Avatar ${num}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlZWUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Tm8gSW1hZ2U8L3RleHQ+PC9zdmc+'">
                        <img src="${storyPath}" alt="Story ${num}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlZWUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Tm8gSW1hZ2U8L3RleHQ+PC9zdmc+'">
                    </div>
                    <div class="slider-controls">
                        <div class="dot active"></div>
                        <div class="dot"></div>
                    </div>
                </div>
                <div class="slider-content">
                    <div class="slider-title">${title}</div>
                    <p class="slider-text">Loading story...</p>
                </div>
            `;
        container.appendChild(card);

        // Fetch text
        fetch(txtPath)
          .then((res) => (res.ok ? res.text() : "No description available."))
          .then((text) => {
            card.querySelector(".slider-text").textContent = text.trim();
          })
          .catch(() => {
            card.querySelector(".slider-text").textContent =
              "No description available.";
          });
      });
    </script>
  </body>
</html>
