<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIM Journey - Gallery</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="dist/output.css" />
  </head>
  <body>
    <app-navbar page="gallery"></app-navbar>

    <div class="container-custom">
      <h2 class="animate-on-scroll">Story Gallery</h2>
      <p class="text-center text-gray-600 mb-6">
        Explore the AI Avatars and Stories created by our participants.
      </p>
      <div
        id="gallery-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"
      >
        <!-- Cards injected via JS -->
      </div>
    </div>

    <app-footer></app-footer>

    <script src="components/Navbar.js"></script>
    <script src="components/Footer.js"></script>
    <script src="components/GalleryCard.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const imageNumbers = [
          1, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 15, 16, 18, 19, 20, 21, 23, 24,
          25, 26, 27, 28, 29, 30, 31,
        ];
        const container = document.getElementById("gallery-container");

        imageNumbers.forEach((num, index) => {
          const card = document.createElement("gallery-card");
          card.setAttribute("num", num);
          card.setAttribute("title", `Participant ${num}`);
          card.className = `animate-on-scroll`;
          card.style.transitionDelay = `${index * 0.05}s`;
          container.appendChild(card);
        });

        // Observer for animations
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: "0px 0px -50px 0px" },
        );
        document
          .querySelectorAll(".animate-on-scroll")
          .forEach((el) => observer.observe(el));
      });
    </script>
  </body>
</html>
