<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIM Journey - Gallery</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav>
      <div class="nav-left">
        <img src="logo.png" alt="Project Logo" class="logo" />
        <span class="nav-brand">AIM Journey</span>
      </div>
      <div class="hamburger"><span></span><span></span><span></span></div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="team.html">Team</a>
        <a href="activities.html">Activities</a>
        <a href="gallery.html">Gallery</a>
        <a href="https://www.instagram.com/aimjourney.eu/" target="_blank">
          <i class="fab fa-instagram instagram-icon"></i>
        </a>
      </div>
    </nav>

    <div class="container">
      <h2 class="animate-on-scroll">Story Gallery</h2>
      <p style="text-align: center; margin-bottom: 2rem">
        Explore the AI Avatars and Stories created by our participants.
      </p>

      <div id="gallery-container" class="gallery-grid">
        <!-- Cards injected via JS -->
      </div>
    </div>

    <footer>
      <div class="footer-content">
        <p>&copy; 2026 AIM Journey Erasmus+ Project</p>
        <p class="disclaimer-text-small">Funded by the European Union.</p>
      </div>
    </footer>

    <script src="script.js"></script>
    <script>
      // Dynamic Gallery Logic
      const imageNumbers = [
        1, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 15, 16, 18, 19, 20, 21, 23, 24, 25,
        26, 27, 28, 29, 30, 31,
      ];
      const container = document.getElementById("gallery-container");

      imageNumbers.forEach((num, index) => {
        const avatarPath = `content/avatars/${num}.jpeg`;
        const storyPath = `content/stories/${num}.jpeg`;
        const txtPath = `content/prompts/${num}.txt`;
        const title = `Participant ${num}`;

        const card = document.createElement("div");
        card.className = "slider-card animate-on-scroll";
        card.style.transitionDelay = `${index * 0.05}s`;

        card.innerHTML = `
          <div class="slider-wrapper">
            <div class="slider-track">
              <img src="${avatarPath}" alt="Avatar ${num}" loading="lazy">
              <img src="${storyPath}" alt="Story ${num}" loading="lazy">
            </div>
            <div class="slider-controls">
              <div class="dot active"></div>
              <div class="dot"></div>
            </div>
          </div>
          <div class="slider-content">
            <div class="slider-title">${title}</div>
            <p class="slider-text">Loading story...</p>
          </div>
        `;
        container.appendChild(card);

        // Fetch text content
        fetch(txtPath)
          .then((res) => (res.ok ? res.text() : "No description available."))
          .then((text) => {
            const textEl = card.querySelector(".slider-text");
            if (textEl) textEl.textContent = text.trim();
          })
          .catch(() => {
            const textEl = card.querySelector(".slider-text");
            if (textEl) textEl.textContent = "No description available.";
          });
      });
    </script>
  </body>
</html>
