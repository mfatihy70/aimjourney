<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIM Journey - Home</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav>
      <div class="nav-left">
        <img src="logo.png" alt="AIM Journey Logo" class="logo" />
        <span class="nav-brand">AIM Journey</span>
      </div>
      <div class="hamburger"><span></span><span></span><span></span></div>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="quotes.html">Quotes</a>
        <a href="https://www.instagram.com/aimjourney.eu/" target="_blank">
          <i class="fab fa-instagram instagram-icon"></i>
        </a>
      </div>
    </nav>

    <div class="hero animate-on-scroll">
      <img src="content/traincover.png" alt="Train Journey Cover" />
    </div>

    <div class="container">
      <!-- New Image Grid 1-11 -->
      <section id="highlights">
        <h2 class="animate-on-scroll">Journey Highlights</h2>
        <div class="home-grid">
          <!-- Generating 1 to 11 -->
          <script>
            for (let i = 1; i <= 11; i++) {
              document.write(
                `<img src="content/info/${i}.jpeg" alt="Highlight ${i}" class="animate-on-scroll" style="transition-delay: ${i * 0.1}s">`,
              );
            }
          </script>
        </div>
      </section>

      <!-- Project Info Cards -->
      <section id="info">
        <h2 class="animate-on-scroll">Our Mission</h2>
        <div
          class="gallery-grid"
          style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr))"
        >
          <div
            class="slider-card animate-on-scroll"
            style="border-top-color: var(--color-blue)"
          >
            <div
              class="slider-content"
              style="height: 100%; justify-content: center; text-align: center"
            >
              <div class="slider-title" style="font-size: 1.2rem">
                Cultural Exchange
              </div>
              <p>Connecting youth across borders.</p>
            </div>
          </div>
          <div
            class="slider-card animate-on-scroll"
            style="border-top-color: var(--color-green)"
          >
            <div
              class="slider-content"
              style="height: 100%; justify-content: center; text-align: center"
            >
              <div class="slider-title" style="font-size: 1.2rem">
                Sustainable Travel
              </div>
              <p>Exploring Europe by train.</p>
            </div>
          </div>
          <div
            class="slider-card animate-on-scroll"
            style="border-top-color: var(--color-orange)"
          >
            <div
              class="slider-content"
              style="height: 100%; justify-content: center; text-align: center"
            >
              <div class="slider-title" style="font-size: 1.2rem">
                Future Impact
              </div>
              <p>Building lasting friendships.</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Bottom Visuals -->
      <section id="visuals" class="animate-on-scroll">
        <h2>Project Visuals</h2>
        <div
          style="
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
          "
        >
          <img
            src="content/poster.jpeg"
            style="
              width: 100%;
              border-radius: 15px;
              box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            "
            alt="Poster"
          />
          <img
            src="content/identity_tree.png"
            style="
              width: 100%;
              border-radius: 15px;
              box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            "
            alt="Identity Tree"
          />
        </div>
      </section>
    </div>

    <footer>
      <p>&copy; 2026 AIM Journey Erasmus+ Project</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
