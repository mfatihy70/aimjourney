<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIM Journey - Quotes</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav>
      <div class="nav-left">
        <img src="logo.png" alt="AIM Journey Logo" class="logo" />
        <span class="nav-brand">AIM Journey</span>
      </div>
      <div class="hamburger"><span></span><span></span><span></span></div>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="quotes.html">Quotes</a>
        <a href="https://www.instagram.com/aimjourney.eu/" target="_blank"
          ><i class="fab fa-instagram instagram-icon"></i
        ></a>
      </div>
    </nav>

    <div class="container">
      <h2 class="animate-on-scroll">Participant Voices</h2>
      <div id="quotes-container" class="quotes-grid">
        <!-- Days injected via JS -->
      </div>
    </div>

    <footer><p>&copy; 2026 AIM Journey Erasmus+ Project</p></footer>

    <script src="script.js"></script>
    <script src="content/quotes/quotes-data.js"></script>
    <script>
      const quotesContainer = document.getElementById("quotes-container");
      const quoteData = window.quoteData || {};

      Object.keys(quoteData)
        .sort((a, b) => Number(a) - Number(b))
        .forEach((dayKey) => {
          const day = Number(dayKey);
          const quotes = quoteData[dayKey];

          const dayHeader = document.createElement("div");
          dayHeader.style.gridColumn = "1 / -1";
          dayHeader.style.marginTop = "20px";
          dayHeader.innerHTML = `<h3 style="color:var(--color-blue); border-bottom:2px solid var(--color-orange); display:inline-block; padding-bottom:5px;">Day ${day}</h3>`;
          quotesContainer.appendChild(dayHeader);

          quotes.forEach((quote) => {
            const quoteCard = document.createElement("div");
            quoteCard.className = "quote-card animate-on-scroll";
            quoteCard.innerHTML = `
              <div class="quote-day">Day ${day}</div>
              <div class="quote-text">"${quote.text.trim()}"</div>
              <div class="quote-author">- AIM_Journey_${quote.participant}</div>
            `;
            quotesContainer.appendChild(quoteCard);
          });
        });
    </script>
  </body>
</html>
