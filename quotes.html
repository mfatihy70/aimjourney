<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIM Journey - Quotes</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="dist/output.css" />
  </head>
  <body>
    <app-navbar page="quotes"></app-navbar>

    <div class="container-custom">
      <h2 class="animate-on-scroll">Participant Voices</h2>
      <div
        id="quotes-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"
      >
        <!-- Quotes injected via JS -->
      </div>
    </div>

    <app-footer></app-footer>

    <script src="components/Navbar.js"></script>
    <script src="components/Footer.js"></script>
    <script src="components/QuoteCard.js"></script>
    <script src="content/quotes/quotes-data.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const quotesContainer = document.getElementById("quotes-container");
        const quoteData = window.quoteData || {};

        Object.keys(quoteData)
          .sort((a, b) => Number(a) - Number(b))
          .forEach((dayKey) => {
            const day = Number(dayKey);
            const quotes = quoteData[dayKey];

            const dayHeader = document.createElement("div");
            dayHeader.className = "col-span-full mt-4";
            dayHeader.innerHTML = `<h3 class="text-xl md:text-2xl font-bold text-aim-blue border-b-2 border-aim-orange inline-block pb-2">Day ${day}</h3>`;
            quotesContainer.appendChild(dayHeader);

            quotes.forEach((quote) => {
              const card = document.createElement("quote-card");
              card.setAttribute("day", day);
              card.setAttribute("text", quote.text.trim());
              card.setAttribute("author", `AIM_Journey_${quote.participant}`);
              card.className = "animate-on-scroll";
              quotesContainer.appendChild(card);
            });
          });

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: "0px 0px -50px 0px" },
        );
        document
          .querySelectorAll(".animate-on-scroll")
          .forEach((el) => observer.observe(el));
      });
    </script>
  </body>
</html>
