<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIM Journey - Quotes</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <app-navbar page="quotes"></app-navbar>

    <main class="container py-5">
      <h2 class="animate-on-scroll">Participant Voices</h2>
      <div id="quotes-container" class="grid-3">
        <!-- Quotes injected via JS -->
      </div>
    </main>

    <app-footer></app-footer>

    <script src="components/Navbar.js"></script>
    <script src="components/Footer.js"></script>
    <script src="components/QuoteCard.js"></script>
    <script src="content/quotes/quotes-data.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const quotesContainer = document.getElementById("quotes-container");
        const quoteData = window.quoteData || {};

        Object.keys(quoteData)
          .sort((a, b) => Number(a) - Number(b))
          .forEach((dayKey) => {
            const day = Number(dayKey);
            const quotes = quoteData[dayKey];

            const header = document.createElement("div");
            header.style.cssText = "grid-column:1/-1;margin-top:1rem;";
            header.innerHTML = `<h3 class="text-primary border-bottom" style="border-bottom:2px solid var(--color-orange);display:inline-block;padding-bottom:0.5rem;">Day ${day}</h3>`;
            quotesContainer.appendChild(header);

            quotes.forEach((quote) => {
              const card = document.createElement("quote-card");
              card.setAttribute("day", day);
              card.setAttribute("text", quote.text.trim());
              card.setAttribute("author", `AIM_Journey_${quote.participant}`);
              card.className = "animate-on-scroll";
              quotesContainer.appendChild(card);
            });
          });

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: "0px 0px -50px 0px" },
        );
        document
          .querySelectorAll(".animate-on-scroll")
          .forEach((el) => observer.observe(el));
      });
    </script>
    <script src="script.js"></script>
  </body>
</html>
